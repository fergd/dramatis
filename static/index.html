<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dramatis</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Ember (dark) — default, matches Baretext's own default theme */
  --bg:#242424; --panel:#191919; --panel2:#242424; --ink:#faf2d6; --muted:#bdae93;
  --line:#3a3a3a; --accent:#f8c537;
  /* Derived from --accent/--panel so every theme gets a correct chip tone
     for free, without a per-theme value — same trick Baretext's own
     --wash-accent/--glass-bg tokens use. */
  --chip: color-mix(in srgb, var(--accent) 14%, var(--panel));
  --scrim: rgba(0,0,0,.58);
  --hf:'IBM Plex Serif',Georgia,serif;
  --danger:#c86a5f; --amber:#c99a3a; --green:#7a9a5b;
}
* { box-sizing: border-box; }
body { margin: 0; }
input, textarea, select, button { font: inherit; color: inherit; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
::placeholder { color: var(--muted); opacity: .65; }
textarea { resize: vertical; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
@keyframes drin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

body {
  min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; padding: 13px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.wordmark-group { display: flex; align-items: baseline; gap: 10px; margin-right: auto; position: relative; }
.wordmark { display: flex; align-items: baseline; cursor: pointer; }
.wordmark span:first-child { font-family: var(--hf); font-size: 23px; font-weight: 600; letter-spacing: .01em; font-style: italic; }
#char-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
.project-switcher-btn { display: flex; align-items: baseline; gap: 5px; border: none; background: none; cursor: pointer; font-family: var(--hf); font-size: 17px; font-style: italic; color: var(--muted); padding: 2px 5px; border-radius: 6px; max-width: 32vw; }
.project-switcher-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-switcher-btn .ps-caret { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-style: normal; }
.project-switcher-btn:hover { color: var(--ink); background: var(--panel2); }
.project-popover { display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 41; width: 270px; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px -14px rgba(0,0,0,.6); animation: drin .15s ease both; }
.project-popover.pp-open { display: block; }
.pp-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.pp-item:hover { background: var(--panel2); }
.pp-item.active { background: var(--chip); font-weight: 600; }
.pp-item .pp-count { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); }
.pp-divider { height: 1px; background: var(--line); margin: 6px 4px; }
.pp-action { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); }
.pp-action:hover { background: var(--panel2); color: var(--ink); }
.pm-meta-row { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.pm-meta-label { flex: 1 1 130px; font-size: 12.5px; color: var(--muted); }
.pm-meta-value { flex: 2 1 200px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; }
.pm-meta-delete { border: 1px solid var(--line); background: var(--panel); width: 40px; padding: 6px 0; border-radius: 7px; cursor: pointer; color: var(--danger); font-size: 12px; flex: none; }
#search-input { width: min(260px, 50vw); padding: 8px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.theme-toggle { display: flex; gap: 2px; padding: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; }
.theme-toggle button { border: none; padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: 'IBM Plex Mono', monospace; background: transparent; color: var(--muted); }
.theme-toggle button.active { background: var(--ink); color: var(--bg); }
.btn-solid { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 9px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-line { border: 1px solid var(--line); background: var(--panel); padding: 9px 13px; border-radius: 8px; cursor: pointer; font-size: 13px; }
#backup-btn { display: inline-flex; align-items: center; gap: 7px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--amber); }
.dot.backed { background: var(--green); }
#user-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }

/* ---------- login gate ---------- */
.login-btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.login-user-btn { padding: 13px 28px; font-size: 15px; }

/* ---------- tag filter row ---------- */
#tagrow { display: flex; gap: 7px; flex-wrap: wrap; padding: 11px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); }
#tagrow:empty { display: none; border-bottom: none; }
.tag-chip { border: 1px solid var(--line); padding: 5px 11px; border-radius: 20px; cursor: pointer; font-size: 12px; font-family: 'IBM Plex Mono', monospace; background: var(--panel); color: var(--muted); }
.tag-chip.active { background: var(--ink); color: var(--bg); }

/* ---------- main / grid ---------- */
main { padding: 0 20px 70px; }
.banner-warn { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 2px; padding: 11px 15px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 9px; }
.banner-warn span { font-size: 13px; color: var(--muted); }
.banner-warn strong { color: var(--ink); }
.banner-warn button { margin-left: auto; border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.gridgap { height: 22px; }

.empty-state { max-width: 460px; margin: 11vh auto; text-align: center; }
.empty-state .title { font-family: var(--hf); font-size: 30px; margin-bottom: 10px; font-style: italic; }
.empty-state p { color: var(--muted); line-height: 1.6; margin: 0 0 22px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }

.card-btn { background: none; border: none; padding: 0; margin: 0; cursor: pointer; display: block; width: 100%; text-align: left; animation: drin .3s ease both; }
.card {
  position: relative; border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--panel);
  box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 12px 30px -20px rgba(0,0,0,.8);
  transition: transform .16s ease, box-shadow .16s ease;
}
@media (hover: hover) {
  .card-btn:hover .card { transform: translateY(-4px); box-shadow: 0 14px 40px -16px rgba(0,0,0,.75); }
}
.card-portrait { position: relative; aspect-ratio: 3/4; background: var(--panel2); }
.card-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(135deg, var(--panel2), var(--panel2) 11px, var(--chip) 11px, var(--chip) 12px); }
.card-placeholder span { font-family: var(--hf); font-size: 62px; color: var(--muted); opacity: .55; }
.card-frame { position: absolute; inset: 6px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; pointer-events: none; }
.card-num { position: absolute; top: 11px; left: 13px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
.card-species { position: absolute; top: 9px; right: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; border-radius: 20px; background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(4px); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-scrim { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 13px 11px; background: linear-gradient(to top, var(--scrim), transparent); }
.card-name { font-family: var(--hf); font-size: 20px; font-weight: 600; color: #fff; line-height: 1.1; text-shadow: 0 1px 5px rgba(0,0,0,.7); }
.card-age { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: rgba(255,255,255,.85); margin-top: 3px; letter-spacing: .03em; }
.card-accentbar { height: 3px; width: 100%; }
.card-info { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-top: 1px solid var(--line); min-height: 22px; }
.card-info span:first-child { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-dot { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ---------- detail view ---------- */
.detail-shell { max-width: 1120px; margin: 0 auto; padding: 20px 20px 90px; }
.detail-topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.detail-topbar .num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
.detail-topbar .delete-btn { margin-left: auto; color: var(--danger); }
.detail-cols { display: flex; flex-wrap: wrap; gap: 30px; align-items: flex-start; }
.detail-left { flex: 1 1 300px; min-width: min(300px, 100%); max-width: 360px; }
.detail-portrait { position: relative; aspect-ratio: 3/4; border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--panel2); }
.detail-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-portrait .card-placeholder span { font-size: 90px; }
.detail-accentbar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; }
#thumb-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.thumb { position: relative; width: 60px; height: 78px; border-radius: 7px; overflow: hidden; border: 2px solid transparent; cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .remove-x { position: absolute; top: 2px; right: 2px; width: 17px; height: 17px; border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; }
.thumb-add { width: 60px; height: 78px; border: 1px dashed var(--line); border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 24px; background: var(--panel); }
.thumb-hint { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin: 9px 2px 0; line-height: 1.5; }

.detail-right { flex: 3 1 380px; min-width: min(300px, 100%); }
#name-input { width: 100%; font-family: var(--hf); font-size: 34px; font-weight: 600; background: none; border: none; border-bottom: 2px solid var(--accent); padding: 2px 0 8px; }
#tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 22px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 20px; padding: 4px 6px 4px 11px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
.chip button { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; padding: 0; }
#tag-input { width: 90px; background: none; border: 1px dashed var(--line); border-radius: 20px; padding: 5px 11px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }

.field-section { margin-bottom: 26px; }
.field-section h3 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 0 0 14px; padding-bottom: 7px; border-bottom: 1px solid var(--line); font-weight: 500; }
.fields-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.fields-grid .span-all { grid-column: 1 / -1; }
.field-label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 5px; }
.field-input, .field-select { width: 100%; padding: 9px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.field-textarea { width: 100%; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; line-height: 1.6; font-size: 14px; }
.color-row { display: flex; align-items: center; gap: 10px; position: relative; }
.color-trigger { width: 46px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--panel2); }
.color-row .hexval { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
.color-row .clear-link { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; }

.color-popover { display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; width: 216px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 16px 40px -14px rgba(0,0,0,.6); animation: drin .15s ease both; }
.color-popover.cp-open { display: block; }
.cp-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.cp-tab { flex: 1; border: 1px solid var(--line); background: var(--panel2); padding: 6px 0; border-radius: 7px; cursor: pointer; font-size: 10px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.cp-tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cp-panel { display: none; }
.cp-panel.active { display: block; }
.swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch-btn { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; }
.swatch-btn.active { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel); }
.cp-custom { display: flex; flex-direction: column; gap: 10px; }
.cp-custom input[type=color] { width: 100%; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
.cp-custom input[type=text] { width: 100%; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; font-family: 'IBM Plex Mono', monospace; }

.rel-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 9px; align-items: center; }
.rel-row select { flex: 1 1 150px; padding: 9px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.rel-row input { flex: 2 1 180px; padding: 9px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.rel-row .rel-role { flex: 1 1 170px; }
.rel-row .rel-remove { border: 1px solid var(--line); background: var(--panel); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; color: var(--muted); flex: none; }
.rel-custom-wrap { flex: 1 1 100%; }
.rel-custom-fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.rel-custom-fields input, .rel-custom-fields select { flex: 1 1 140px; font-size: 12.5px; }
.add-rel-btn { border: 1px dashed var(--line); background: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 4px; }
.detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.detail-hint { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin: 12px 0 0; line-height: 1.5; }

/* ---------- modals ---------- */
.modal-scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; animation: drin .2s ease both; }
.modal-box h2 { font-family: var(--hf); font-size: 22px; margin: 0 0 4px; font-style: italic; font-weight: 600; }
.modal-box .lede { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
.modal-label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 5px; }
.modal-input, .modal-select, .modal-textarea { width: 100%; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
.type-btn-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
.type-btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.type-btn.active { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.modal-actions-end { display: flex; gap: 10px; justify-content: flex-end; }

.mf-row { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.mf-order { display: flex; flex-direction: column; gap: 1px; }
.mf-order button { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 10px; line-height: 1; padding: 1px; }
.mf-order button:disabled { opacity: .3; cursor: default; }
.mf-label-input { flex: 1; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; }
.mf-label-static { flex: 1; font-size: 13.5px; }
.mf-type { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; background: var(--chip); padding: 3px 8px; border-radius: 20px; border: none; appearance: none; cursor: pointer; }
.mf-builtin { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); width: 52px; text-align: center; }
.mf-delete { border: 1px solid var(--line); background: var(--panel); width: 52px; padding: 6px 0; border-radius: 7px; cursor: pointer; color: var(--danger); font-size: 12px; }

/* ---------- map view ---------- */
.map-shell { position: relative; margin: 16px auto 0; max-width: 1200px; border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--bg); animation: drin .3s ease both; }
#map-svg { display: block; width: 100%; height: 70vh; }
.map-edge { stroke-width: 1.25; opacity: .7; }
.map-node circle { cursor: grab; transition: r .12s ease; }
.map-node:active circle { cursor: grabbing; }
@media (hover: hover) { .map-node:hover circle { r: 9; } }
.map-node-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; fill: var(--muted); pointer-events: none; user-select: none; }
.map-legend { position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 30px -20px rgba(0,0,0,.8); }
.map-legend-row { display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.map-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ---------- import view ---------- */
.import-shell { max-width: 900px; margin: 0 auto; padding: 20px 20px 90px; animation: drin .3s ease both; }
.import-shell h1 { font-family: var(--hf); font-size: 28px; font-style: italic; margin: 0 0 6px; }
.import-shell .lede { color: var(--muted); font-size: 13.5px; margin: 0 0 26px; line-height: 1.6; }
.import-dropzone { border: 1px dashed var(--line); border-radius: 14px; padding: 40px 20px; text-align: center; background: var(--panel); cursor: pointer; }
.import-dropzone:hover { border-color: var(--accent); }
.import-dropzone .hint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 8px; }
.import-or { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 18px 0; }
.import-pastebox { width: 100%; padding: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; font-family: 'IBM Plex Mono', monospace; line-height: 1.5; min-height: 160px; }
.import-loading { text-align: center; padding: 60px 20px; color: var(--muted); }
.import-section { margin: 30px 0; }
.import-section h2 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-weight: 500; }
.import-item { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.import-item input[type=checkbox] { margin-top: 3px; flex: none; width: 16px; height: 16px; accent-color: var(--accent); }
.import-item-body { flex: 1; min-width: 0; }
.import-item-title { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
.import-badge { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 20px; background: var(--chip); color: var(--muted); }
.import-badge.new { color: var(--green); }
.import-badge.existing { color: var(--amber); }
.import-field-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-top: 1px solid var(--line); }
.import-field-row:first-of-type { border-top: none; }
.import-field-row label { display: flex; align-items: center; gap: 6px; flex: none; width: 160px; color: var(--muted); font-size: 12px; }
.import-field-row .field-preview { flex: 1; color: var(--ink); white-space: pre-wrap; overflow: hidden; text-overflow: ellipsis; max-height: 4.8em; }
.import-field-row .field-current { flex: 1; color: var(--muted); font-size: 11.5px; font-style: italic; }
.import-meta-value { flex: 1; padding: 7px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; }

@media (max-width: 640px) {
  header { padding: 11px 14px; }
  #search-input { width: 100%; order: 4; }
  main, .detail-shell { padding-left: 14px; padding-right: 14px; }
}
</style>
</head>
<body>

<header style="display:none">
  <div class="wordmark-group" id="wordmark-group">
    <div class="wordmark" id="wordmark"><span>Dramatis</span></div>
    <button class="project-switcher-btn" id="project-switcher-btn" title="Switch project">
      <span id="project-switcher-label"></span><span class="ps-caret">▾</span>
    </button>
    <span id="char-count"></span>
    <div class="project-popover" id="project-popover"></div>
  </div>
  <input id="search-input" placeholder="Search name, role, species, tag…">
  <div class="theme-toggle" id="theme-toggle"></div>
  <button class="btn-solid" id="new-btn">+ New</button>
  <button class="btn-line" id="map-btn">Map</button>
  <button class="btn-line" id="backup-btn" title="Backup status"><span class="dot" id="backup-dot"></span>Backup</button>
  <button class="btn-line" id="user-btn" title="Switch user"></button>
</header>

<div id="tagrow"></div>

<main id="main-content"></main>

<div id="modal-root"></div>

<script>
// Ported from Baretext's theme palette (src/index.html) — --bg/--text/
// --border/--accent map directly; Baretext only has two surface tones
// (--bg, --bg-alt) where Dramatis has three (--bg, --panel, --panel2), so
// --panel2 cycles back to Baretext's --bg, giving inputs contrast against
// the --panel surface they sit inside without inventing a new color.
// `swatches`: preset options for "colour"-type fields (e.g. accent colour).
// Each theme's own accent/heading tokens are the anchor, extended with more
// hues in the same register rather than staying literally just those few —
// Amstrad, e.g., is a green-phosphor terminal but real CRT terminals also
// shipped in amber and white phosphor, so those are fair game too. Grove
// and Dracula are named, fully-specified public palettes (Everforest and
// Dracula respectively) — their extra swatches are the rest of those
// palettes' documented accent colors, not invented.
const THEMES = {
  dark:    { label: 'Ember',     vars: { '--bg':'#242424','--panel':'#191919','--panel2':'#242424','--ink':'#faf2d6','--muted':'#bdae93','--line':'#3a3a3a','--accent':'#f8c537' },
             swatches: ['#f8c537','#e8c97a','#c4a85a','#a08844','#7a6832','#e0954a','#c85a3f'] },
  light:   { label: 'Parchment', vars: { '--bg':'#f5f0e8','--panel':'#ede8de','--panel2':'#f5f0e8','--ink':'#2a2218','--muted':'#6b5f4a','--line':'#d0c8b8','--accent':'#b8820a' },
             swatches: ['#b8820a','#8b5e0a','#b07820','#7a5515','#5a3e0e','#9c4a3a','#4a5c6b','#5c6b3a'] },
  amstrad: { label: 'Amstrad',   vars: { '--bg':'#0d130d','--panel':'#0a0f0a','--panel2':'#0d130d','--ink':'#c8e6b0','--muted':'#79956c','--line':'#1c281a','--accent':'#7dc45a' },
             swatches: ['#7dc45a','#8fd670','#6fb050','#549040','#3d6c30','#e0a030','#4ad0c0','#d8e8d0'] },
  grove:   { label: 'Grove',     vars: { '--bg':'#2f383e','--panel':'#272f34','--panel2':'#2f383e','--ink':'#d3c6aa','--muted':'#9aa79d','--line':'#525c62','--accent':'#a7c080' },
             swatches: ['#a7c080','#e69875','#dbbc7f','#83c092','#7fbbb3','#e67e80','#d699b6'] },
  dracula: { label: 'Dracula',   vars: { '--bg':'#282a36','--panel':'#21222c','--panel2':'#282a36','--ink':'#f8f8f2','--muted':'#97a1bf','--line':'#44475a','--accent':'#bd93f9' },
             swatches: ['#bd93f9','#ff79c6','#8be9fd','#50fa7b','#ffb86c','#ff5555','#f1fa8c'] },
};
const TYPE_LABELS = { text: 'Short text', textarea: 'Paragraph', number: 'Number', select: 'Select', date: 'Date', color: 'Colour' };
const SECTION_ORDER = ['Identity', 'Description', 'Notes', 'Custom'];

let STATE = {
  fields: [], characters: [], status: null, relationshipRoles: null,
  theme: localStorage.getItem('dramatis.theme') || 'dark',
  view: 'grid', selectedId: null, selectedDetail: null,
  search: '', activeTag: null,
  project: null, projects: [],
};

// ---------------------------------------------------------------- helpers

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isValidColor(v) { return typeof v === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(v.trim()); }

// Fixed, theme-independent — same source of truth as the backend
// (GET /relationship_roles), not derived from the active theme's swatch
// array. The author learns "red = Antagonistic" once and it stays true
// no matter which of the 5 UI themes is active.
function colorForCategory(category) {
  const cat = STATE.relationshipRoles && STATE.relationshipRoles.categories.find(c => c.name === category);
  return cat ? cat.color : 'var(--muted)';
}
function setActiveSwatch(container, color) {
  if (!container) return;
  const c = (color || '').toLowerCase();
  container.querySelectorAll('.swatch-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.color.toLowerCase() === c);
  });
}
function initials(name) {
  const p = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (res.status === 401 && path !== '/me' && path !== '/login') {
    // Stale/cleared cookie mid-session — reload into the login gate instead
    // of surfacing a generic fetch-error alert.
    window.location.reload();
    throw new Error('Not logged in');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

function applyTheme(id) {
  // Falls back to 'dark' for anyone with an old theme id (noir/atlas/archive)
  // still saved in localStorage from before this palette swap — resolve to
  // the actual key used, not the stale input, so the toggle row and storage
  // both self-correct instead of staying stuck on an invalid id forever.
  const themeId = THEMES[id] ? id : 'dark';
  const t = THEMES[themeId];
  const el = document.documentElement;
  Object.entries(t.vars).forEach(([k, v]) => el.style.setProperty(k, v));
  STATE.theme = themeId;
  localStorage.setItem('dramatis.theme', themeId);
  renderThemeToggle();
  // Colour-field swatch options are theme-specific — refresh them in place
  // if a character's detail view is already open when the theme changes.
  if (STATE.view === 'detail' && STATE.selectedDetail) redrawFieldSections();
  // Map edge/legend colors are fixed per category (not theme-derived), so
  // no recolor needed here — node fills/strokes use var(--accent)/
  // var(--panel) and pick up the new theme automatically via CSS.
}

// ---------------------------------------------------------------- header (built once, updated in place)

function buildHeaderOnce() {
  document.getElementById('wordmark').addEventListener('click', () => goGrid());
  const search = document.getElementById('search-input');
  search.addEventListener('input', e => { STATE.search = e.target.value; renderGridResults(); });
  document.getElementById('new-btn').addEventListener('click', createNewCharacter);
  document.getElementById('map-btn').addEventListener('click', () => goMap());
  document.getElementById('backup-btn').addEventListener('click', openBackupModal);
  document.getElementById('user-btn').addEventListener('click', async () => {
    try { await api('POST', '/logout'); } catch (e) {}
    window.location.reload();
  });
  document.getElementById('project-switcher-btn').addEventListener('click', e => {
    e.stopPropagation();
    toggleProjectPopover();
  });
  document.addEventListener('click', e => {
    if (e.target.closest('.project-popover') || e.target.closest('.project-switcher-btn')) return;
    closeProjectPopover();
  });
  renderThemeToggle();
}

function updateUserBadge() {
  document.getElementById('user-btn').textContent = STATE.owner + ' · switch';
}

function renderThemeToggle() {
  const el = document.getElementById('theme-toggle');
  el.innerHTML = Object.keys(THEMES).map(id =>
    `<button class="${STATE.theme === id ? 'active' : ''}" data-theme="${id}">${THEMES[id].label}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
  });
}

function updateCharCount() {
  const n = STATE.characters.length;
  document.getElementById('char-count').textContent = n + (n === 1 ? ' character' : ' characters');
}

function updateBackupDot() {
  const backed = !!(STATE.status && STATE.status.last_backup_at);
  const dot = document.getElementById('backup-dot');
  dot.className = 'dot' + (backed ? ' backed' : '');
  document.getElementById('backup-btn').title = backed
    ? 'Last backup: ' + new Date(STATE.status.last_backup_at).toLocaleString()
    : 'Not backed up yet';
}

// ---------------------------------------------------------------- project switcher

function renderProjectSwitcherButton() {
  document.getElementById('project-switcher-label').textContent = STATE.project ? STATE.project.title : '';
}

function toggleProjectPopover() {
  const pop = document.getElementById('project-popover');
  const willOpen = !pop.classList.contains('pp-open');
  closeProjectPopover();
  if (willOpen) { drawProjectPopover(); pop.classList.add('pp-open'); }
}

function closeProjectPopover() {
  document.getElementById('project-popover').classList.remove('pp-open');
}

function drawProjectPopover() {
  const pop = document.getElementById('project-popover');
  const sorted = [...STATE.projects].sort((a, b) => (a.last_opened_at < b.last_opened_at ? 1 : -1));
  pop.innerHTML = sorted.map(p => `
    <button class="pp-item ${STATE.project && p.id === STATE.project.id ? 'active' : ''}" data-id="${p.id}">
      <span>${escapeHtml(p.title || 'Untitled Project')}</span>
      <span class="pp-count">${p.character_count}</span>
    </button>`).join('') + `
    <div class="pp-divider"></div>
    <button class="pp-action" id="pp-new">+ New project</button>
    <button class="pp-action" id="pp-settings">Project settings…</button>
    <button class="pp-action" id="pp-import" ${STATE.status && !STATE.status.import_configured ? 'disabled title="Not configured — add ANTHROPIC_API_KEY"' : ''}>Import document…</button>`;

  pop.querySelectorAll('.pp-item').forEach(btn => {
    btn.addEventListener('click', () => switchProject(Number(btn.dataset.id)));
  });
  document.getElementById('pp-new').addEventListener('click', () => { closeProjectPopover(); openNewProjectModal(); });
  document.getElementById('pp-settings').addEventListener('click', () => { closeProjectPopover(); openProjectSettingsModal(); });
  const importBtn = document.getElementById('pp-import');
  if (STATE.status && !STATE.status.import_configured) importBtn.style.opacity = '.5';
  importBtn.addEventListener('click', () => { closeProjectPopover(); goImport(); });
}

async function switchProject(id) {
  if (STATE.project && id === STATE.project.id) { closeProjectPopover(); return; }
  closeProjectPopover();
  try {
    const project = await api('POST', `/projects/${id}/activate`);
    STATE.project = STATE.projects.find(p => p.id === id) || project;
    STATE.projects = await api('GET', '/projects');
    STATE.project = STATE.projects.find(p => p.id === id) || STATE.project;
  } catch (e) {
    alert('Could not switch project: ' + e.message);
    return;
  }
  renderProjectSwitcherButton();
  STATE.search = '';
  STATE.activeTag = null;
  try {
    STATE.fields = await api('GET', '/fields');
  } catch (e) {
    alert('Could not load this project’s fields: ' + e.message);
  }
  await loadStatus();
  await goGrid();
}

function openNewProjectModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-scrim" id="np-scrim">
      <div class="modal-box" style="width:min(420px,100%)" id="np-box">
        <h2>New project</h2>
        <p class="lede">A separate cast, field set, and map — good for a new book or novella.</p>
        <label class="modal-label">Title</label>
        <input class="modal-input" id="np-title" placeholder="e.g. Testing the Spirits">
        <div class="modal-actions-end">
          <button class="btn-line" id="np-cancel">Cancel</button>
          <button class="btn-solid" id="np-save">Create</button>
        </div>
      </div>
    </div>`;
  const scrim = document.getElementById('np-scrim');
  scrim.addEventListener('click', e => { if (e.target === scrim) closeModal(); });
  document.getElementById('np-box').addEventListener('click', e => e.stopPropagation());
  document.getElementById('np-cancel').addEventListener('click', closeModal);
  document.getElementById('np-title').focus();
  document.getElementById('np-save').addEventListener('click', async () => {
    const title = document.getElementById('np-title').value.trim() || 'Untitled Project';
    try {
      const project = await api('POST', '/projects', { title });
      STATE.projects = await api('GET', '/projects');
      closeModal();
      await switchProject(project.id);
    } catch (e) {
      alert('Could not create project: ' + e.message);
    }
  });
}

// ---------------------------------------------------------------- project settings modal

async function openProjectSettingsModal() {
  let project;
  try {
    project = await api('GET', `/projects/${STATE.project.id}`);
  } catch (e) {
    alert('Could not load project settings: ' + e.message);
    return;
  }
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-scrim" id="ps-scrim">
      <div class="modal-box" style="width:min(520px,100%);max-height:82vh;overflow:auto" id="ps-box">
        <h2>Project settings</h2>
        <p class="lede">Metadata for this book — add your own fields the same way you add character fields.</p>
        <label class="modal-label">Title</label>
        <input class="modal-input" id="ps-title" value="${escapeHtml(project.title)}">
        <div id="ps-meta-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
        <button class="btn-line" id="ps-add-meta" style="margin-bottom:20px">+ Add project field</button>
        <div class="modal-actions-end" style="justify-content:space-between">
          <button class="btn-line" id="ps-delete" style="color:var(--danger)">Delete project</button>
          <button class="btn-solid" id="ps-done">Done</button>
        </div>
      </div>
    </div>`;

  const scrim = document.getElementById('ps-scrim');
  scrim.addEventListener('click', e => { if (e.target === scrim) closeProjectSettingsModal(); });
  document.getElementById('ps-box').addEventListener('click', e => e.stopPropagation());
  document.getElementById('ps-done').addEventListener('click', closeProjectSettingsModal);

  const titleInput = document.getElementById('ps-title');
  titleInput.addEventListener('change', async () => {
    const title = titleInput.value.trim();
    if (!title) { titleInput.value = project.title; return; }
    try {
      const updated = await api('PUT', `/projects/${project.id}`, { title });
      project.title = updated.title;
      STATE.project.title = updated.title;
      STATE.projects = await api('GET', '/projects');
      renderProjectSwitcherButton();
    } catch (e) {
      alert('Could not rename project: ' + e.message);
    }
  });

  document.getElementById('ps-add-meta').addEventListener('click', async () => {
    const label = prompt('Field name (e.g. Setting, Logline, Viewpoint):');
    if (!label || !label.trim()) return;
    try {
      await api('POST', `/projects/${project.id}/meta`, { label: label.trim() });
      project = await api('GET', `/projects/${project.id}`);
      drawProjectMetaList(project);
    } catch (e) {
      alert('Could not add field: ' + e.message);
    }
  });

  document.getElementById('ps-delete').addEventListener('click', async () => {
    if (!confirm(`Delete "${project.title}" permanently? This removes every character, field, and relationship in it.`)) return;
    try {
      await api('DELETE', `/projects/${project.id}`);
    } catch (e) {
      alert('Could not delete project: ' + e.message);
      return;
    }
    closeModal();
    window.location.reload();
  });

  drawProjectMetaList(project);
}

function closeProjectSettingsModal() {
  closeModal();
}

function drawProjectMetaList(project) {
  const list = document.getElementById('ps-meta-list');
  const sorted = [...project.meta].sort((a, b) => a.sort_order - b.sort_order);
  list.innerHTML = sorted.map(m => `
    <div class="pm-meta-row" data-key="${escapeHtml(m.key)}">
      <span class="pm-meta-label">${escapeHtml(m.label)}</span>
      <input class="pm-meta-value" data-role="value" value="${escapeHtml(m.value)}" placeholder="—">
      <button class="pm-meta-delete" data-role="delete">&times;</button>
    </div>`).join('');

  list.querySelectorAll('.pm-meta-row').forEach(row => {
    const key = row.dataset.key;
    row.querySelector('[data-role=value]').addEventListener('change', async e => {
      try {
        await api('PUT', `/projects/${project.id}/meta/${encodeURIComponent(key)}`, { value: e.target.value });
      } catch (err) {
        alert('Could not save: ' + err.message);
      }
    });
    row.querySelector('[data-role=delete]').addEventListener('click', async () => {
      try {
        await api('DELETE', `/projects/${project.id}/meta/${encodeURIComponent(key)}`);
        project.meta = project.meta.filter(m => m.key !== key);
        drawProjectMetaList(project);
      } catch (err) {
        alert('Could not remove field: ' + err.message);
      }
    });
  });
}

// ---------------------------------------------------------------- boot / routing

window.addEventListener('DOMContentLoaded', async () => {
  applyTheme(STATE.theme);
  const meRes = await fetch('/me');
  if (meRes.status === 401) {
    await showLoginView();
    return;
  }
  if (!meRes.ok) {
    document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Can't reach the server</div></div>`;
    return;
  }
  const me = await meRes.json();
  STATE.owner = me.username;

  document.querySelector('header').style.display = '';
  buildHeaderOnce();
  updateUserBadge();

  try {
    STATE.projects = await api('GET', '/projects');
    let activeProject = STATE.projects[0]; // /projects orders by last_opened_at DESC
    if (!activeProject) {
      activeProject = await api('POST', '/projects', {});
      STATE.projects = [activeProject];
    }
    await api('POST', `/projects/${activeProject.id}/activate`);
    STATE.project = activeProject;
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Can't reach the server</div><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  renderProjectSwitcherButton();

  try {
    [STATE.fields, STATE.relationshipRoles] = await Promise.all([
      api('GET', '/fields'),
      api('GET', '/relationship_roles'),
    ]);
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Can't reach the server</div><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  await loadStatus();
  await goGrid();
});

async function showLoginView() {
  let users = [];
  try {
    users = await api('GET', '/users');
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Can't reach the server</div><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  document.getElementById('main-content').innerHTML = `
    <div class="empty-state">
      <div class="title">Who's logging in?</div>
      <p>Pick your name to see your own characters and fields.</p>
      <div class="login-btn-row">
        ${users.map(u => `<button class="btn-solid login-user-btn" data-username="${escapeHtml(u.username)}">${escapeHtml(u.username)}</button>`).join('')}
      </div>
    </div>`;
  document.querySelectorAll('.login-user-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await api('POST', '/login', { username: btn.dataset.username });
      } catch (e) {
        alert(e.message);
        return;
      }
      window.location.reload();
    });
  });
}

async function loadStatus() {
  try { STATE.status = await api('GET', '/status'); } catch (e) { STATE.status = null; }
  updateBackupDot();
}

async function goGrid() {
  STATE.view = 'grid';
  STATE.selectedId = null;
  STATE.selectedDetail = null;
  try {
    STATE.characters = await api('GET', '/characters');
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Could not load characters</div><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  updateCharCount();
  renderTagRow();
  renderGridView();
}

async function goDetail(id) {
  STATE.view = 'detail';
  STATE.selectedId = id;
  document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Loading…</div></div>`;
  try {
    // Refresh the character list too — it drives the collection number and
    // the relationship-target dropdown, both of which need current names,
    // not whatever was cached from the last gallery visit.
    [STATE.selectedDetail, STATE.characters] = await Promise.all([
      api('GET', `/characters/${id}`),
      api('GET', '/characters'),
    ]);
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Could not load this character</div><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  updateCharCount();
  renderDetailView();
}

async function goMap() {
  STATE.view = 'map';
  STATE.selectedId = null;
  STATE.selectedDetail = null;
  document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Loading…</div></div>`;
  let characters, relationships;
  try {
    [characters, relationships] = await Promise.all([
      api('GET', '/characters'),
      api('GET', '/relationships'),
    ]);
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="empty-state"><div class="title">Could not load the map</div><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  updateCharCount();
  renderTagRow();
  renderMapView(characters, relationships);
}

async function createNewCharacter() {
  try {
    const c = await api('POST', '/characters', { name: '' });
    await goDetail(c.id);
  } catch (e) {
    alert('Could not create character: ' + e.message);
  }
}

// ---------------------------------------------------------------- tag row (gallery only)

function renderTagRow() {
  const el = document.getElementById('tagrow');
  if (STATE.view !== 'grid') { el.innerHTML = ''; return; }
  const tagSet = [];
  STATE.characters.forEach(c => (c.tags || []).forEach(t => { if (!tagSet.includes(t)) tagSet.push(t); }));
  if (tagSet.length === 0) { el.innerHTML = ''; return; }
  const chips = [{ label: 'All', key: null }, ...tagSet.map(t => ({ label: t, key: t }))];
  el.innerHTML = chips.map(t =>
    `<button class="tag-chip ${STATE.activeTag === t.key ? 'active' : ''}" data-key="${t.key === null ? '' : escapeHtml(t.key)}">${escapeHtml(t.label)}</button>`
  ).join('');
  el.querySelectorAll('.tag-chip').forEach((btn, i) => {
    btn.addEventListener('click', () => { STATE.activeTag = chips[i].key; renderTagRow(); renderGridResults(); });
  });
}

// ---------------------------------------------------------------- grid view

function renderGridView() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div id="backup-banner"></div>
    <div class="gridgap"></div>
    <div id="grid-results"></div>`;
  renderGridResults();
}

function filteredCharacters() {
  const q = STATE.search.trim().toLowerCase();
  return STATE.characters
    .map((c, i) => ({ c, num: '№ ' + String(i + 1).padStart(3, '0') }))
    .filter(({ c }) => {
      if (STATE.activeTag && !(c.tags || []).includes(STATE.activeTag)) return false;
      if (!q) return true;
      const hay = [c.name, c.role_archetype, c.species_race, ...(c.tags || [])].join(' ').toLowerCase();
      return hay.includes(q);
    });
}

function renderGridResults() {
  if (STATE.view !== 'grid') return;
  const banner = document.getElementById('backup-banner');
  const backed = !!(STATE.status && STATE.status.last_backup_at);
  banner.innerHTML = (!backed && STATE.characters.length > 0) ? `
    <div class="banner-warn">
      <span>Not yet backed up to Google Drive — back up to your <strong>“Character Profile App”</strong> folder.</span>
      <button id="banner-backup-btn">Back up now</button>
    </div>` : '';
  if (banner.querySelector('#banner-backup-btn')) {
    banner.querySelector('#banner-backup-btn').addEventListener('click', openBackupModal);
  }

  const results = filteredCharacters();
  const empty = STATE.characters.length === 0;
  const el = document.getElementById('grid-results');

  if (results.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="title">${empty ? 'No cast yet' : 'No matches'}</div>
        <p>${empty ? 'Build your first character — add a portrait, fill in the fields, invent your own along the way.' : 'Try a different search term or clear the active tag.'}</p>
        ${empty ? `<button class="btn-solid" id="empty-new-btn" style="padding:11px 20px;border-radius:9px">Create your first character</button>` : ''}
      </div>`;
    if (empty) el.querySelector('#empty-new-btn').addEventListener('click', createNewCharacter);
    return;
  }

  el.innerHTML = `<div class="grid">${results.map(({ c, num }) => cardHTML(c, num)).join('')}</div>`;
  el.querySelectorAll('.card-btn').forEach(btn => {
    btn.addEventListener('click', () => goDetail(Number(btn.dataset.id)));
  });
}

function cardHTML(c, num) {
  const acc = isValidColor(c.accent_colour) ? c.accent_colour : 'var(--accent)';
  const portrait = c.portrait_url
    ? `<img src="${escapeHtml(c.portrait_url)}" alt="" loading="lazy">`
    : `<div class="card-placeholder"><span>${escapeHtml(initials(c.name))}</span></div>`;
  const ageLine = c.age ? `<div class="card-age">Age ${escapeHtml(c.age)}</div>` : '';
  const speciesTag = c.species_race ? `<span class="card-species">${escapeHtml(c.species_race)}</span>` : '';
  const roleLine = c.role_archetype || (c.name ? '' : 'Untitled');
  return `
    <button class="card-btn" data-id="${c.id}">
      <article class="card">
        <div class="card-portrait">
          ${c.portrait_url ? portrait : `<div class="card-placeholder"><span>${escapeHtml(initials(c.name))}</span></div>`}
          <span class="card-frame"></span>
          <span class="card-num">${escapeHtml(num)}</span>
          ${speciesTag}
          <div class="card-scrim">
            <div class="card-name">${escapeHtml(c.name || 'Unnamed')}</div>
            ${ageLine}
          </div>
        </div>
        <div class="card-accentbar" style="background:${escapeHtml(acc)}"></div>
        <div class="card-info">
          <span>${escapeHtml(roleLine)}</span>
          <span class="card-dot" style="background:${escapeHtml(acc)}"></span>
        </div>
      </article>
    </button>`;
}

// ---------------------------------------------------------------- detail view

function fieldsBySection() {
  const bySec = {}; const order = [];
  STATE.fields.forEach(f => { if (!bySec[f.section]) { bySec[f.section] = []; order.push(f.section); } bySec[f.section].push(f); });
  return { bySec, order };
}

function sectionOptionsList() {
  const { order } = fieldsBySection();
  const opts = [...order];
  SECTION_ORDER.forEach(s => { if (!opts.includes(s)) opts.push(s); });
  return opts;
}

function renderDetailView() {
  const d = STATE.selectedDetail;
  const idx = STATE.characters.findIndex(c => c.id === d.id);
  const num = '№ ' + String((idx >= 0 ? idx : 0) + 1).padStart(3, '0');

    <div class="detail-shell">
      <div class="detail-topbar">
        <button class="btn-line" id="back-btn">&larr; All characters</button>
        <span class="num">${escapeHtml(num)}</span>
        <button class="btn-line delete-btn" id="delete-char-btn">Delete</button>
      </div>
      <div class="detail-cols">
        <div class="detail-left">
          <div class="detail-portrait" id="detail-portrait" style="--acc:${escapeHtml(acc)}"></div>
          <div id="thumb-strip"></div>
          <p class="thumb-hint">Click a thumbnail to set the primary portrait.</p>
        </div>
        <div class="detail-right">
          <input id="name-input" placeholder="Character name" value="${escapeHtml(d.name)}" style="border-bottom-color:${escapeHtml(acc)}">
          <div id="tag-row"></div>
          <div id="field-sections"></div>
          <div class="field-section">
            <h3>Relationships</h3>
            <div id="relationships-list"></div>

            <p class="detail-hint">Relationships are mirrored automatically on the other character.</p>

          <p class="detail-hint">New fields become standard on every character. Changes save automatically.</p>

    </div>`;

  document.getElementById('back-btn').addEventListener('click', goGrid);
  document.getElementById('delete-char-btn').addEventListener('click', handleDeleteCharacter);
  document.getElementById('add-field-btn').addEventListener('click', () => openAddFieldModal());

  document.getElementById('add-rel-btn').addEventListener('click', handleAddRelationship);

  const nameInput = document.getElementById('name-input');

    d.name = nameInput.value;
    try { await api('PUT', `/characters/${d.id}`, { name: d.name }); } catch (e) { alert('Could not save name: ' + e.message); }

  redrawPortraitBlock();
  redrawTagRow();
  redrawFieldSections();

}

// ---- portrait / images ----

function redrawPortraitBlock() {
  const d = STATE.selectedDetail;
  const primary = d.images.find(im => im.is_primary) || d.images[0] || null;
  const acc = isValidColor(d.values.accent_colour) ? d.values.accent_colour : 'var(--accent)';

  const portraitEl = document.getElementById('detail-portrait');
  portraitEl.innerHTML = primary
    ? `<img src="${escapeHtml(primary.url)}" alt="">`
    : `<div class="card-placeholder"><span>${escapeHtml(initials(d.name))}</span></div>`;
  portraitEl.insertAdjacentHTML('beforeend', `<div class="detail-accentbar" style="background:${escapeHtml(acc)}"></div>`);

  const strip = document.getElementById('thumb-strip');
  strip.innerHTML = d.images.map(im => `
    <div class="thumb" style="border-color:${im.is_primary ? escapeHtml(acc) : 'transparent'}" data-id="${im.id}">
      <img src="${escapeHtml(im.thumb_url)}" alt="">
      <button class="remove-x" data-remove="${im.id}">&times;</button>
    </div>`).join('') + `
    <label class="thumb-add">+
      <input type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none" id="image-upload-input">
    </label>`;

  strip.querySelectorAll('.thumb').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.remove-x')) return;
      setPrimaryImage(Number(el.dataset.id));
    });
  });
  strip.querySelectorAll('.remove-x').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); removeImage(Number(btn.dataset.remove)); });
  });
  document.getElementById('image-upload-input').addEventListener('change', e => {
    if (e.target.files.length) uploadImages(e.target.files);
  });
}

async function uploadImages(fileList) {
  for (const f of fileList) {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { alert(`"${f.name}" isn't a JPEG, PNG, or WebP image`); return; }
    if (f.size > 8 * 1024 * 1024) { alert(`"${f.name}" is larger than 8MB`); return; }
  }
  const fd = new FormData();
  for (const f of fileList) fd.append('files', f);
  try {
    STATE.selectedDetail = await api('POST', `/characters/${STATE.selectedDetail.id}/images`, fd);
    redrawPortraitBlock();
  } catch (e) {
    alert('Upload failed: ' + e.message);
  }
}

async function setPrimaryImage(imageId) {
  try {
    STATE.selectedDetail = await api('PUT', `/characters/${STATE.selectedDetail.id}/images/${imageId}/primary`);
    redrawPortraitBlock();
  } catch (e) {
    alert('Could not set primary image: ' + e.message);
  }
}

async function removeImage(imageId) {
  try {
    STATE.selectedDetail = await api('DELETE', `/characters/${STATE.selectedDetail.id}/images/${imageId}`);
    redrawPortraitBlock();
  } catch (e) {
    alert('Could not remove image: ' + e.message);
  }
}

// ---- tags ----

function redrawTagRow() {
  const d = STATE.selectedDetail;
  const el = document.getElementById('tag-row');
  el.innerHTML = (d.tags || []).map(t =>
    `<span class="chip">${escapeHtml(t)}<button data-tag="${escapeHtml(t)}">&times;</button></span>`
  ).join('') + `<input id="tag-input" placeholder="+ tag">`;

  el.querySelectorAll('.chip button').forEach(btn => {
    btn.addEventListener('click', () => removeTag(btn.dataset.tag));
  });
  document.getElementById('tag-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = e.target.value.trim();
      if (v) addTag(v);
      e.target.value = '';
    }
  });
}

async function addTag(tag) {
  const d = STATE.selectedDetail;
  if ((d.tags || []).includes(tag)) return;
  const newTags = [...(d.tags || []), tag];
  try {
    STATE.selectedDetail = await api('PUT', `/characters/${d.id}`, { tags: newTags });
    redrawTagRow();
  } catch (e) {
    alert('Could not add tag: ' + e.message);
  }
}

async function removeTag(tag) {
  const d = STATE.selectedDetail;
  const newTags = (d.tags || []).filter(t => t !== tag);
  try {
    STATE.selectedDetail = await api('PUT', `/characters/${d.id}`, { tags: newTags });
    redrawTagRow();
  } catch (e) {
    alert('Could not remove tag: ' + e.message);
  }
}

// ---- field sections ----

function redrawFieldSections() {
  const d = STATE.selectedDetail;
  const { bySec, order } = fieldsBySection();
  const el = document.getElementById('field-sections');

  el.innerHTML = order.map(secName => `
    <div class="field-section">
      <h3>${escapeHtml(secName)}</h3>
      <div class="fields-grid">${bySec[secName].map(f => fieldControlHTML(f, d.values[f.key])).join('')}</div>
    </div>`).join('');

  order.forEach(secName => {
    bySec[secName].forEach(f => {
      const input = document.getElementById(`field-${f.id}`);
      if (!input) return;
      if (f.type === 'color') {
        wireColorControl(`field-${f.id}`, f.key);
      } else {
        input.addEventListener('change', () => saveFieldValue(f.key, input.value));
      }
    });
  });
}

async function saveFieldValue(key, value) {
  const d = STATE.selectedDetail;
  d.values[key] = value;
  try {
    await api('PUT', `/characters/${d.id}`, { values: { [key]: value } });
    if (key === 'accent_colour') {
      // threaded through the name underline and portrait accent strip — cheap
      // to patch directly rather than re-rendering the whole detail view
      const acc = isValidColor(value) ? value : 'var(--accent)';
      const nameInput = document.getElementById('name-input');
      if (nameInput) nameInput.style.borderBottomColor = acc;
      redrawPortraitBlock();
    }
  } catch (e) {
    alert('Could not save: ' + e.message);
  }
}

function fieldControlHTML(f, rawValue) {
  const value = rawValue === undefined || rawValue === null ? '' : rawValue;
  const id = `field-${f.id}`;
  const wrapClass = (f.type === 'textarea' || f.type === 'select') ? 'span-all' : '';
  let control = '';
  if (f.type === 'textarea') {
    control = `<textarea class="field-textarea" id="${id}" rows="4" placeholder="Write freely…">${escapeHtml(value)}</textarea>`;
  } else if (f.type === 'number') {
    control = `<input type="number" class="field-input" id="${id}" value="${escapeHtml(value)}" placeholder="—">`;
  } else if (f.type === 'date') {
    control = `<input type="date" class="field-input" id="${id}" value="${escapeHtml(value)}">`;
  } else if (f.type === 'select') {
    const opts = (f.options || []).map(o => `<option value="${escapeHtml(o)}" ${o === value ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
    control = `<select class="field-select" id="${id}"><option value="">—</option>${opts}</select>`;
  } else if (f.type === 'color') {
    control = colorControlHTML(id, value);
  } else {
    control = `<input type="text" class="field-input" id="${id}" value="${escapeHtml(value)}" placeholder="—">`;
  }
  return `<div class="${wrapClass}"><label class="field-label">${escapeHtml(f.label)}</label>${control}</div>`;
}

// ---- colour field: theme-swatch + native-picker popover, tabbed ----

function colorControlHTML(id, value) {
  const hex = isValidColor(value) ? value : '#000000';
  const swatches = (THEMES[STATE.theme] && THEMES[STATE.theme].swatches) || [];
  const swatchGrid = swatches.map(sw =>
    `<button type="button" class="swatch-btn${sw.toLowerCase() === String(value).toLowerCase() ? ' active' : ''}" style="background:${sw}" data-color="${sw}" title="${sw}"></button>`
  ).join('');
  return `<div class="color-row">
    <button type="button" class="color-trigger" id="${id}-trigger" style="${isValidColor(value) ? `background:${escapeHtml(value)}` : ''}"></button>
    <span class="hexval" id="${id}-hex">${value ? escapeHtml(value) : '—'}</span>
    <button type="button" class="clear-link" id="${id}-clear">clear</button>
    <div class="color-popover" id="${id}-popover">
      <div class="cp-tabs">
        <button type="button" class="cp-tab active" data-tab="theme">Theme</button>
        <button type="button" class="cp-tab" data-tab="custom">Custom</button>
      </div>
      <div class="cp-panel active" data-panel="theme"><div class="swatch-grid" id="${id}-swatches">${swatchGrid}</div></div>
      <div class="cp-panel" data-panel="custom">
        <div class="cp-custom">
          <input type="color" id="${id}" value="${escapeHtml(hex)}">
          <input type="text" id="${id}-hexinput" placeholder="#rrggbb" maxlength="7" value="${isValidColor(value) ? escapeHtml(value) : ''}">
        </div>
      </div>
    </div>
  </div>`;
}

function closeAllColorPopovers() {
  document.querySelectorAll('.color-popover.cp-open').forEach(p => p.classList.remove('cp-open'));
}

// One global listener handles every colour field on the page — attached
// once at load, not per-field, since redrawFieldSections() can re-render
// the same fields many times over a session (each fieldControlHTML() call
// makes a fresh popover element, so a per-field listener would leak).
document.addEventListener('click', e => {
  if (e.target.closest('.color-popover') || e.target.closest('.color-trigger')) return;
  closeAllColorPopovers();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllColorPopovers(); });

function wireColorControl(id, key) {
  const trigger = document.getElementById(`${id}-trigger`);
  const popover = document.getElementById(`${id}-popover`);
  const hexEl = document.getElementById(`${id}-hex`);
  const clearBtn = document.getElementById(`${id}-clear`);
  const swatchGrid = document.getElementById(`${id}-swatches`);
  const nativeInput = document.getElementById(id);
  const hexInput = document.getElementById(`${id}-hexinput`);

  const apply = color => {
    trigger.style.background = isValidColor(color) ? color : '';
    hexEl.textContent = color ? color : '—';
    setActiveSwatch(swatchGrid, color || '');
    nativeInput.value = isValidColor(color) ? color : '#000000';
    hexInput.value = isValidColor(color) ? color : '';
    saveFieldValue(key, color || '');
  };

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    const willOpen = !popover.classList.contains('cp-open');
    closeAllColorPopovers();
    if (willOpen) popover.classList.add('cp-open');
  });
  popover.querySelectorAll('.cp-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      popover.querySelectorAll('.cp-tab').forEach(t => t.classList.toggle('active', t === tab));
      popover.querySelectorAll('.cp-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tab.dataset.tab));
    });
  });
  swatchGrid.querySelectorAll('.swatch-btn').forEach(btn => {
    btn.addEventListener('click', () => { apply(btn.dataset.color); closeAllColorPopovers(); });
  });
  clearBtn.addEventListener('click', () => apply(''));
  nativeInput.addEventListener('input', () => { hexEl.textContent = nativeInput.value; hexInput.value = nativeInput.value; });
  nativeInput.addEventListener('change', () => apply(nativeInput.value));
  hexInput.addEventListener('change', () => {
    if (hexInput.value && !isValidColor(hexInput.value)) { alert('Enter a valid hex colour, e.g. #b8820a'); hexInput.value = ''; return; }
    apply(hexInput.value);
  });
}

// ---- relationships (reciprocal — see GET /relationship_roles for the catalog) ----

function relRoleSelectHTML(currentRoleKey) {
  const catalog = STATE.relationshipRoles || { categories: [], roles: [] };
  const isCustom = !!(currentRoleKey && currentRoleKey.startsWith('custom:'));
  const groups = catalog.categories.map(cat => {
    const inCat = catalog.roles.filter(r => r.category === cat.name);
    if (!inCat.length) return '';
    return `<optgroup label="${escapeHtml(cat.name)}">${inCat.map(r =>
      `<option value="${r.key}" ${r.key === currentRoleKey ? 'selected' : ''}>${escapeHtml(r.label)}</option>`
    ).join('')}</optgroup>`;
  }).join('');
  return `<select class="rel-role" data-role="role">
    <option value="">— role —</option>${groups}<option value="__custom__" ${isCustom ? 'selected' : ''}>Custom…</option>
  </select>`;
}

function relCustomFieldsHTML(roleLabel, category) {
  const catalog = STATE.relationshipRoles || { categories: [] };
  return `<div class="rel-custom-fields">
    <input type="text" data-role="custom-label" placeholder="Role label, e.g. Blood-bound" value="${escapeHtml(roleLabel || '')}">
    <input type="text" data-role="custom-inverse" placeholder="Inverse (optional — same as above if blank)">
    <select data-role="custom-category">
      ${catalog.categories.map(c => `<option value="${escapeHtml(c.name)}" ${c.name === (category || 'Other') ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
    </select>
  </div>`;
}

// Draft rows are client-side only — a relationship record needs both a
// target character AND a role to exist at all under the reciprocal model
// (no "half-formed" row like the old one-field-at-a-time design), so
// "+ Add relationship" adds a scratch entry here and only POSTs once both
// are filled in. Keyed by a stable per-detail-view counter, not array
// index, so removing/committing one draft never shifts another's identity.
function redrawRelationships() {
  const d = STATE.selectedDetail;
  const el = document.getElementById('relationships-list');
  const otherChars = STATE.characters.filter(c => c.id !== d.id);
  if (!d._drafts) d._drafts = [];

  const rows = [
    ...(d.relationships || []).map(r => ({ ...r, rowKey: `r-${r.id}` })),
    ...d._drafts.map(dr => ({ ...dr, rowKey: `d-${dr._draftId}` })),
  ];

  el.innerHTML = rows.map(r => {
    const isCustom = !!(r.role_key && r.role_key.startsWith('custom:'));
    return `
    <div class="rel-row" data-key="${r.rowKey}">
      <select data-role="target">
        <option value="">— choose character —</option>
        ${otherChars.map(c => `<option value="${c.id}" ${c.id === r.related_id ? 'selected' : ''}>${escapeHtml(c.name || 'Unnamed')}</option>`).join('')}
      </select>
      ${relRoleSelectHTML(r.role_key)}
      <button class="rel-remove" data-role="remove">&times;</button>
      <div class="rel-custom-wrap" data-role="custom-wrap" style="${isCustom ? '' : 'display:none'}">${relCustomFieldsHTML(r.role_label, r.category)}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('.rel-row').forEach(row => {
    const [kind, idStr] = row.dataset.key.split('-');
    const isDraft = kind === 'd';
    const relId = isDraft ? null : Number(idStr);
    const draftId = isDraft ? Number(idStr) : null;
    const getDraft = () => d._drafts.find(x => x._draftId === draftId);

    const targetSelect = row.querySelector('[data-role=target]');
    const roleSelect = row.querySelector('[data-role=role]');
    const customWrap = row.querySelector('[data-role=custom-wrap]');

    function maybeCommitDraft() {
      const draft = getDraft();
      if (!draft || !draft.related_id || !draft.role_key || draft.role_key === '__pending_custom__') return;
      commitDraftRelationship(draftId);
    }

    targetSelect.addEventListener('change', e => {
      const val = e.target.value ? Number(e.target.value) : null;
      if (isDraft) { getDraft().related_id = val; maybeCommitDraft(); }
      else changeRelationshipTarget(relId, val);
    });

    roleSelect.addEventListener('change', () => {
      if (roleSelect.value === '__custom__') {
        customWrap.style.display = '';
        customWrap.querySelector('[data-role=custom-label]').focus();
        if (isDraft) getDraft().role_key = '__pending_custom__';
        return;
      }
      customWrap.style.display = 'none';
      if (isDraft) { const dr = getDraft(); dr.role_key = roleSelect.value; dr.customPayload = null; maybeCommitDraft(); }
      else saveRelationshipRole(relId, roleSelect.value);
    });

    if (customWrap) {
      const applyCustom = () => {
        const label = customWrap.querySelector('[data-role=custom-label]').value.trim();
        if (!label) return;
        const inverse = customWrap.querySelector('[data-role=custom-inverse]').value.trim();
        const category = customWrap.querySelector('[data-role=custom-category]').value;
        const payload = { custom_label: label, custom_inverse_label: inverse || undefined, category };
        if (isDraft) { const dr = getDraft(); dr.role_key = 'custom'; dr.customPayload = payload; maybeCommitDraft(); }
        else saveRelationshipRole(relId, 'custom', payload);
      };
      customWrap.querySelectorAll('input, select').forEach(el2 => el2.addEventListener('change', applyCustom));
    }

    row.querySelector('[data-role=remove]').addEventListener('click', () => {
      if (isDraft) { d._drafts = d._drafts.filter(x => x._draftId !== draftId); redrawRelationships(); }
      else removeRelationship(relId);
    });
  });
}

function handleAddRelationship() {
  const d = STATE.selectedDetail;
  if (!d._drafts) d._drafts = [];
  if (d._draftCounter === undefined) d._draftCounter = 0;
  d._drafts.push({ _draftId: d._draftCounter++, related_id: null, role_key: null, role_label: '', category: 'Other', customPayload: null });
  redrawRelationships();
}

async function commitDraftRelationship(draftId) {
  const d = STATE.selectedDetail;
  const draft = d._drafts.find(x => x._draftId === draftId);
  if (!draft) return;
  try {
    const body = { from_id: d.id, to_id: draft.related_id, role: draft.role_key };
    if (draft.role_key === 'custom' && draft.customPayload) Object.assign(body, draft.customPayload);
    const rel = await api('POST', '/relationships', body);
    d._drafts = d._drafts.filter(x => x._draftId !== draftId);
    d.relationships.push(rel);
    redrawRelationships();
  } catch (e) {
    alert('Could not add relationship: ' + e.message);
  }
}

// The backend ties a record to a specific pair of characters — changing
// the target means this row now describes a different pair entirely, so
// it's a delete-and-recreate (keeping the same role) rather than a
// simple field patch.
async function changeRelationshipTarget(relId, newTargetId) {
  const d = STATE.selectedDetail;
  const existing = d.relationships.find(r => r.id === relId);
  if (!existing || !newTargetId) { redrawRelationships(); return; }
  try {
    await api('DELETE', `/relationships/${relId}`);
    const body = { from_id: d.id, to_id: newTargetId, role: existing.role_key };
    if (existing.role_key && existing.role_key.startsWith('custom:')) {
      body.role = 'custom';
      body.custom_label = existing.role_label;
      body.category = existing.category;
    }
    const rel = await api('POST', '/relationships', body);
    d.relationships = d.relationships.filter(r => r.id !== relId);
    d.relationships.push(rel);
    redrawRelationships();
  } catch (e) {
    alert('Could not change target: ' + e.message);
    redrawRelationships();
  }
}

async function saveRelationshipRole(relId, role, extra) {
  const d = STATE.selectedDetail;
  try {
    const body = Object.assign({ from_id: d.id, role }, extra || {});
    const rel = await api('PUT', `/relationships/${relId}`, body);
    const idx = d.relationships.findIndex(r => r.id === relId);
    if (idx >= 0) d.relationships[idx] = rel;
  } catch (e) {
    alert('Could not save relationship: ' + e.message);
    redrawRelationships();
  }
}

async function removeRelationship(relId) {
  const d = STATE.selectedDetail;
  try {
    await api('DELETE', `/relationships/${relId}`);
    d.relationships = d.relationships.filter(r => r.id !== relId);
    redrawRelationships();
  } catch (e) {
    alert('Could not remove relationship: ' + e.message);
  }
}
